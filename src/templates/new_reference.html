<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
  <title>Lisää lähde</title>
  <!-- näkyy vain yksi lomake kerrallaan -->
  <style>
    #all_references form { display:none;}
    #all_references.f-Kirja form[name=Kirja],
    #all_references.f-Artikkeli form[name=Artikkeli] { display:block;}
  </style>
</head>
<body>
  <div class="header">
    <h1>Uusi lähde</h1>
  </div>

  <div class="page-container">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
      <div><b>VIRHE!</b></div>
        {% for message in messages %}
          <div>{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <label for="reference_selector">Valitse lähdetyyppi:</label>
    <select id="reference_selector">
      <option value="_" selected disabled>Valitse</option>
      <option value="Kirja">Kirja</option>
      <option value="Artikkeli">Artikkeli</option>
    </select>

    <h3 style="text-align: center;">Uusi lähde:</h3>
    <div id="all_references">
      <form name="Kirja" action="/create_book" method="POST">
        <p>
          <label for="book-name">Lähteen nimi</label>
          <input type="text" id="book-name" name="name" />
        </p>
        <p>
          <label for="book-author">Kirjoittaja</label>
          <input type="text" id="book-author" name="author" />
        </p>
        <p>
          <label for="book-editor">Editoija</label>
          <input type="text" id="book-editor" name="editor" />
        </p>
        <p>
          <label for="book-title">Kirjan nimi</label>
          <input type="text" id="book-title" name="title" />
        </p>
        <p>
          <label for="book-publisher">Julkaisija</label>
          <input type="text" id="book-publisher" name="publisher" />
        </p>
        <p>
          <label for="book-year">Julkaisu vuosi</label>
          <input type="number" id="book-year" name="year" />
        </p>
        <p>
          <label for="book-note">Muistiipano</label>
          <input type="text" id="book-note" name="note" />
        </p>

        <input type="submit" value="Lisää Lähde" />
      </form>

      <form name="Artikkeli" action="/create_article" method="POST">
        <p>
          <label for="article-name">Lähteen nimi</label>
          <input type="text" id="article-name" name="name" />
        </p>
        <p>
          <label for="article-author">Kirjoittaja</label>
          <input type="text" id="article-author" name="author" />
        </p>
        <p>
          <label for="article-journal">Julkaisu</label>
          <input type="text" id="article-journal" name="journal" />
        </p>
        <p>
          <label for="article-title">Artikkelin nimi</label>
          <input type="text" id="article-title" name="title" />
        </p>
        <p>
          <label for="article-year">Julkaisu vuosi</label>
          <input type="number" id="article-year" name="year" />
        </p>
        <p>
          <label for="article-note">Muistiipano</label>
          <input type="text" id="article-note" name="note" />
        </p>

        <input type="submit" value="Lisää Lähde" />
      </form>
    </div>

    <script>
      const referenceSelect = document.getElementById("reference_selector"),
      allReferences = document.getElementById('all_references');

      referenceSelect.oninput=()=>{ allReferences.className = `f-${referenceSelect.value}` }
    </script>
    <p>
      <a href="/" class="button">Etusivulle</a>
    </p>
  </div>

<div class="footer">
  <p>miniproggis</p>
</div>

</body>
</html>
